<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Analyze Email | SpamGuard AI</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/analyze.css') }}"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <nav>
      <h2>🛡 SpamGuard AI</h2>

      <div>
        <a href="/">Home</a>

        <a href="/about">About</a>
      </div>
    </nav>

    <section class="container">
      <h1>AI Email Analyzer</h1>

      <p>Paste your email or upload a text file for AI analysis.</p>

      <form
        id="analyzeForm"
        action="/predict"
        method="POST"
        enctype="multipart/form-data"
      >
        <textarea
          name="message"
          id="message"
          rows="18"
          placeholder="Paste your Email here..."
        ></textarea>
        <div class="upload-section">
          <label for="textfile"> 📄 Upload Email/Text File (.txt) </label>

          <input type="file" id="textfile" name="textfile" accept=".txt" />
        </div>

        <div class="counter">
          <span id="characters"> Characters : 0 </span>

          <span id="words"> Words : 0 </span>
        </div>

        <div class="samples">
          <button type="button" id="spamBtn">Load Spam Sample</button>

          <button type="button" id="safeBtn">Load Legitimate Sample</button>
        </div>

        <button class="analyzeBtn">🚀 Analyze Email</button>
      </form>
      <!-- AI Loading Overlay -->
      <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-box">
          <div class="ai-circle">🤖</div>

          <h2>AI Spam Detection Engine</h2>

          <p id="loadingStatus">Initializing...</p>

          <div class="progress">
            <div class="progress-bar" id="loadingBar"></div>
          </div>

          <h3 id="loadingPercent">0%</h3>
        </div>
      </div>
    </section>
    <input type="hidden" id="hiddenMessage" />

    <script src="{{ url_for('static', filename='js/analyze.js') }}"></script>
  </body>
</html>
